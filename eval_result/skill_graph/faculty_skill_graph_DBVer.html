        const dept1Select = document.getElementById('dept1');
    const dept2Select = document.getElementById('dept2');
    const univ1Select = document.getElementById('univ1');
    const univ2Select = document.getElementById('univ2');

    const allDepts = Object.keys(dataDict).sort();

    function populateDept(deptSelect, univFilter, defaultIndex) {
        const currentVal = deptSelect.value;
        deptSelect.innerHTML = '';
        let matchedDepts = allDepts;
        if (univFilter !== 'all') {
            // 学部名は "九州大学 理学部" のようになっているので startsWith で判定
            matchedDepts = allDepts.filter(dept => dept.startsWith(univFilter));
        }

        let foundCurrent = false;
        matchedDepts.forEach((dept, idx) => {
            const text = `${dept} (学科数: ${dataDict[dept].department_count})`;
            const opt = document.createElement('option');
            opt.value = dept;
            opt.textContent = text;
            deptSelect.appendChild(opt);

            if (currentVal === dept) {
                opt.selected = true;
                foundCurrent = true;
            }
        });

        if (!foundCurrent && matchedDepts.length > 0) {
            if (defaultIndex < matchedDepts.length) {
                deptSelect.selectedIndex = defaultIndex;
            } else {
                deptSelect.selectedIndex = 0;
            }
        }
    }

    univ1Select.addEventListener('change', () => {
        populateDept(dept1Select, univ1Select.value, 0);
        updateChart();
    });

    univ2Select.addEventListener('change', () => {
        populateDept(dept2Select, univ2Select.value, 0);
        updateChart();
    });

    // Initialize
    populateDept(dept1Select, 'all', 0);
    populateDept(dept2Select, 'all', 1);

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            r: {
                min: 0,
                max: 3,
                ticks: {
                    stepSize: 0.5,
                    backdropColor: 'transparent'
                },
                pointLabels: {
                    font: {
                        size: 11,
                        weight: 'bold'
                    },
                    color: '#475569'
                }
            }
        },
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    font: { size: 14, weight: 'bold' }
                }
            }
        }
    };

    function createDataset(label, colorRGB) {
        return {
            label: label,
            data: [],
            backgroundColor: `rgba(${colorRGB}, 0.2)`,
            borderColor: `rgba(${colorRGB}, 1)`,
            borderWidth: 2,
            pointBackgroundColor: `rgba(${colorRGB}, 1)`,
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: `rgba(${colorRGB}, 1)`
        };
    }

    const labelsAll = [...labelsA, ...labelsB];

    const ctxAll = document.getElementById('radarChartAll').getContext('2d');
    const radarChartAll = new Chart(ctxAll, {
        type: 'radar',
        data: {
            labels: labelsAll,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: {
                    display: true,
                    text: '全24スキル統合レーダーチャート',
                    font: { size: 18 }
                }
            }
        }
    });

    const ctxA = document.getElementById('radarChartA').getContext('2d');
    const radarChartA = new Chart(ctxA, {
        type: 'radar',
        data: {
            labels: labelsA,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: { display: true, text: '知識関連スキル (A-1〜A-12)', font: { size: 18 } }
            }
        }
    });

    const ctxB = document.getElementById('radarChartB').getContext('2d');
    const radarChartB = new Chart(ctxB, {
        type: 'radar',
        data: {
            labels: labelsB,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: { display: true, text: '汎用スキル関連 (B-1〜B-12)', font: { size: 18 } }
            }
        }
    });

    function updateChart() {
        const val1 = dept1Select.value;
        const val2 = dept2Select.value;
        const normModeRadios = document.querySelector('input[name="norm_mode"]:checked');
        const normMode = normModeRadios ? normModeRadios.value : 'raw';
        const viewModeRadios = document.querySelector('input[name="view_mode"]:checked');
        const viewMode = viewModeRadios ? viewModeRadios.value : 'split';

        // 表示の切り替え
        document.getElementById('chart-split-view').style.display = viewMode === 'split' ? 'flex' : 'none';
        document.getElementById('chart-combined-view').style.display = viewMode === 'combined' ? 'flex' : 'none';

        let keyA = 'values_A';
        let keyB = 'values_B';
        let maxScale = 3.0;
        let stepScale = 0.5;

        if (normMode === 'l1_24') {
            keyA = 'values_A_l1_24';
            keyB = 'values_B_l1_24';
            maxScale = undefined;
            stepScale = undefined;
        } else if (normMode === 'max_24') {
            keyA = 'values_A_max_24';
            keyB = 'values_B_max_24';
            maxScale = 1.0;
            stepScale = 0.2;
        } else if (normMode === 'l1_ind') {
            keyA = 'values_A_l1_ind';
            keyB = 'values_B_l1_ind';
            maxScale = undefined;
            stepScale = undefined;
        } else if (normMode === 'max_ind') {
            keyA = 'values_A_max_ind';
            keyB = 'values_B_max_ind';
            maxScale = 1.0;
            stepScale = 0.2;
        }

        radarChartA.options.scales.r.max = maxScale;
        radarChartA.options.scales.r.ticks.stepSize = stepScale;
        radarChartB.options.scales.r.max = maxScale;
        radarChartB.options.scales.r.ticks.stepSize = stepScale;
        radarChartAll.options.scales.r.max = maxScale;
        radarChartAll.options.scales.r.ticks.stepSize = stepScale;

        if (dataDict[val1]) {
            const data1A = dataDict[val1][keyA];
            const data1B = dataDict[val1][keyB];

            radarChartA.data.datasets[0].label = val1;
            radarChartA.data.datasets[0].data = data1A;
            radarChartB.data.datasets[0].label = val1;
            radarChartB.data.datasets[0].data = data1B;
            radarChartAll.data.datasets[0].label = val1;
            radarChartAll.data.datasets[0].data = [...data1A, ...data1B];
        }
        if (dataDict[val2]) {
            const data2A = dataDict[val2][keyA];
            const data2B = dataDict[val2][keyB];

            radarChartA.data.datasets[1].label = val2;
            radarChartA.data.datasets[1].data = data2A;
            radarChartB.data.datasets[1].label = val2;
            radarChartB.data.datasets[1].data = data2B;
            radarChartAll.data.datasets[1].label = val2;
            radarChartAll.data.datasets[1].data = [...data2A, ...data2B];
        }

        radarChartA.update();
        radarChartB.update();
        radarChartAll.update();
    }

    dept1Select.addEventListener('change', updateChart);
    dept2Select.addEventListener('change', updateChart);

    const modeRadiosAll = document.querySelectorAll('input[type="radio"]');
    modeRadiosAll.forEach(radio => radio.addEventListener('change', updateChart));

    updateChart();
</script>
