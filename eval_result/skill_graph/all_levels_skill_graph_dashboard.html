<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全階層スキルバランス 統合ダッシュボード</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .tabs {
            display: flex;
            background-color: #e9ecef;
            border-bottom: 2px solid #dee2e6;
        }
        .tab-button {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background-color: inherit;
            font-size: 16px;
            font-weight: bold;
            color: #495057;
            transition: 0.3s;
        }
        .tab-button:hover {
            background-color: #dee2e6;
        }
        .tab-button.active {
            background-color: white;
            color: #007bff;
            border-bottom: 3px solid #007bff;
        }
        .tab-content {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>全階層スキルバランス 統合ダッシュボード</h1>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab(event, 'Department')">1. 学科レベル</button>
        <button class="tab-button" onclick="openTab(event, 'Faculty')">2. 学部レベル</button>
        <button class="tab-button" onclick="openTab(event, 'University')">3. 大学レベル</button>
    </div>

    <div id="Department" class="tab-content active">
        <iframe src="../eval_result/skill_graph/department_skill_graph_DBVer.html"></iframe>
    </div>

    <div id="Faculty" class="tab-content">
        <iframe src="../eval_result/skill_graph/faculty_skill_graph_DBVer.html"></iframe>
    </div>

    <div id="University" class="tab-content">
        <iframe src="../eval_result/skill_graph/university_radar_comparison_DBVer.html"></iframe>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
