            const opt = document.createElement('option');
            opt.value = dept;
            opt.textContent = text;
            deptSelect.appendChild(opt);

            if (currentVal === dept) {
                opt.selected = true;
                foundCurrent = true;
            }
        });

        if (!foundCurrent && matchedDepts.length > 0) {
            if (defaultIndex < matchedDepts.length) {
                deptSelect.selectedIndex = defaultIndex;
            } else {
                deptSelect.selectedIndex = 0;
            }
        }
    }

    univ1Select.addEventListener('change', () => {
        populateDept(dept1Select, univ1Select.value, 0);
        updateChart();
    });

    univ2Select.addEventListener('change', () => {
        populateDept(dept2Select, univ2Select.value, 0);
        updateChart();
    });

    // Initialize
    populateDept(dept1Select, 'all', 0);
    populateDept(dept2Select, 'all', 1);

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
            padding: 30
        },
        scales: {
            r: {
                min: 0,
                max: 3,
                ticks: {
                    stepSize: 0.5,
                    backdropColor: 'transparent'
                },
                pointLabels: {
                    font: {
                        size: 10,
                        weight: 'bold'
                    },
                    color: '#475569',
                    callback: function(value) {
                        if (typeof value !== 'string') return value;
                        const maxLength = 13;
                        const lines = value.split('\n');
                        const result = [];
                        lines.forEach(line => {
                            if (line.length <= maxLength) {
                                result.push(line);
                            } else {
                                const words = line.split(' ');
                                let currentLine = '';
                                words.forEach(w => {
                                    if ((currentLine + w).length > maxLength && currentLine.length > 0) {
                                        result.push(currentLine);
                                        currentLine = w;
                                    } else {
                                        currentLine = currentLine ? currentLine + ' ' + w : w;
                                    }
                                });
                                if (currentLine) result.push(currentLine);
                            }
                        });
                        return result;
                    }
                }
            }
        },
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    font: {
                        size: 14,
                        weight: 'bold'
                    }
                }
            }
        }
    };

    function createDataset(label, colorRGB) {
        return {
            label: label,
            data: [],
            backgroundColor: `rgba(${colorRGB}, 0.2)`,
            borderColor: `rgba(${colorRGB}, 1)`,
            borderWidth: 2,
            pointBackgroundColor: `rgba(${colorRGB}, 1)`,
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: `rgba(${colorRGB}, 1)`
        };
    }

    // Chart.js レーダーチャートの初期化
    const ctxA = document.getElementById('radarChartA').getContext('2d');
    const radarChartA = new Chart(ctxA, {
        type: 'radar',
        data: {
            labels: labelsA,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: {
                    display: true,
                    text: '知識関連スキル (A-1〜A-12)',
                    font: { size: 18 }
                }
            }
        }
    });

    const ctxB = document.getElementById('radarChartB').getContext('2d');
    const radarChartB = new Chart(ctxB, {
        type: 'radar',
        data: {
            labels: labelsB,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: {
                    display: true,
                    text: '汎用スキル (B-1〜B-12)',
                    font: { size: 18 }
                }
            }
        }
    });

    // 選択された学部のデータにチャートを更新する関数
    function updateChart() {
        const val1 = dept1Select.value;
        const val2 = dept2Select.value;

        if (dataDict[val1]) {
            radarChartA.data.datasets[0].label = `${val1} (${dataDict[val1].subjects} sub)`;
            radarChartA.data.datasets[0].data = dataDict[val1].values_A;
            radarChartB.data.datasets[0].label = `${val1} (${dataDict[val1].subjects} sub)`;
            radarChartB.data.datasets[0].data = dataDict[val1].values_B;
        }
        if (dataDict[val2]) {
            radarChartA.data.datasets[1].label = `${val2} (${dataDict[val2].subjects} sub)`;
            radarChartA.data.datasets[1].data = dataDict[val2].values_A;
            radarChartB.data.datasets[1].label = `${val2} (${dataDict[val2].subjects} sub)`;
            radarChartB.data.datasets[1].data = dataDict[val2].values_B;
        }
        radarChartA.update();
        radarChartB.update();
    }

    dept1Select.addEventListener('change', updateChart);
    dept2Select.addEventListener('change', updateChart);

    updateChart();
</script>

</body>
</html>
