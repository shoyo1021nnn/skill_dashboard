    const btn = document.createElement('button');
    btn.className = 'dept-btn';
    btn.textContent = dept;
    btn.onclick = () => showRanking(dept, btn);
    btnContainer.appendChild(btn);
  });

  // ランキングを表示する関数
  function showRanking(dept, activeBtn) {
    // 選択状態のスタイルをリセット
    document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');

    const data = rankingData[dept];

    let html = `<h1>「${dept}」の類似度ランキング</h1>`;
    html += `
      <table>
        <thead>
          <tr>
            <th class="rank-col">順位</th>
            <th>比較対象（大学・学科）</th>
            <th class="score-col">類似度スコア</th>
          </tr>
        </thead>
        <tbody>
    `;

    // 表の行を生成
    data.forEach(item => {
      html += `
        <tr>
          <td class="rank-col">${item.rank}</td>
          <td>${item.target}</td>
          <td class="score-col">${item.score.toFixed(4)}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contentDiv.innerHTML = html;
  }
</script>
</body>
</html>
