
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル類似度ランキング ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0f172a;
    --sidebar-bg: rgba(30, 41, 59, 0.7);
    --card-bg: rgba(30, 41, 59, 0.5);
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
  }

  body { 
    font-family: 'Inter', 'Noto Sans JP', sans-serif; 
    margin: 0; 
    padding: 0; 
    display: flex; 
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: var(--text-main); 
    min-height: 100vh;
  }

  #sidebar { 
    width: 320px; 
    height: 100vh; 
    overflow-y: auto; 
    background: var(--sidebar-bg); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-right: 1px solid var(--border);
    padding: 24px; 
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  #sidebar h2 { 
    margin-top: 0; 
    font-size: 1.25rem; 
    font-weight: 800;
    letter-spacing: 0.05em;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    padding-bottom: 20px; 
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .dept-btn { 
    display: block; 
    width: 100%; 
    padding: 14px 16px; 
    margin-bottom: 10px; 
    background: transparent; 
    color: var(--text-muted); 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    cursor: pointer; 
    text-align: left; 
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    position: relative;
    overflow: hidden;
  }

  .dept-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, rgba(56,189,248,0.1), rgba(129,140,248,0.1));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .dept-btn:hover { 
    color: var(--text-main);
    border-color: rgba(56, 189, 248, 0.5);
    transform: translateX(4px);
  }

  .dept-btn:hover::before { opacity: 1; }

  .dept-btn.active { 
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(129, 140, 248, 0.2) 100%);
    color: var(--accent); 
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
  }

  #main { 
    flex-grow: 1; 
    padding: 40px 60px; 
    box-sizing: border-box; 
    overflow-y: auto; 
    height: 100vh;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(56, 189, 248, 0.15);
    filter: blur(100px);
    border-radius: 50%;
    top: -100px;
    right: -100px;
    pointer-events: none;
    z-index: 0;
  }

  #content {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    animation: fadeIn 0.5s ease-out;
  }

  h1 { 
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 30px;
    display: inline-block;
  }

  .subtitle {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.1em;
      text-transform: uppercase;
  }

  .ranking-card { 
    background: var(--card-bg); 
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 16px; 
    padding: 24px; 
    margin-bottom: 16px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    animation: slideUp 0.5s ease-out forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  .ranking-card:nth-child(1) { animation-delay: 0.1s; border-left: 4px solid #fbbf24; }
  .ranking-card:nth-child(2) { animation-delay: 0.2s; border-left: 4px solid #94a3b8; }
  .ranking-card:nth-child(3) { animation-delay: 0.3s; border-left: 4px solid #b45309; }
  .ranking-card:nth-child(4) { animation-delay: 0.4s; }
  .ranking-card:nth-child(5) { animation-delay: 0.5s; }

  .ranking-card:hover { 
    transform: translateY(-4px) scale(1.01); 
    box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    border-color: rgba(255,255,255,0.2);
    background: rgba(40, 53, 72, 0.6);
  }

  .rank-badge { 
    width: 48px; 
    height: 48px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    border-radius: 12px; 
    font-size: 1.25rem; 
    font-weight: 800; 
    margin-right: 24px; 
    flex-shrink: 0; 
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
  }

  .ranking-card:nth-child(1) .rank-badge { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
  .ranking-card:nth-child(2) .rank-badge { background: rgba(148, 163, 184, 0.15); color: #f8fafc; }
  .ranking-card:nth-child(3) .rank-badge { background: rgba(180, 83, 9, 0.15); color: #f59e0b; }

  .rank-info { flex-grow: 1; }

  .rank-name { 
    font-size: 1.15rem; 
    font-weight: 700; 
    margin-bottom: 6px; 
    color: #e2e8f0;
  }

  .rank-score { 
    color: var(--text-muted); 
    font-size: 0.9rem; 
    font-variant-numeric: tabular-nums;
  }

  .score-visual {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
  }

  .score-bar-container { 
    width: 140px; 
    background-color: rgba(255,255,255,0.05); 
    border-radius: 999px; 
    height: 8px; 
    overflow: hidden; 
  }

  .score-bar { 
    height: 100%; 
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    border-radius: 999px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    position: relative;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .score-percentage {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      min-width: 48px;
      text-align: right;
  }

  #welcome-msg { 
    text-align: center; 
    color: var(--text-muted); 
    margin-top: 35vh; 
    font-size: 1.1rem;
    animation: pulse 2s infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
  }
</style>
</head>

  <div id="btn-container"></div>

</div>

  const btnContainer = document.getElementById('btn-container');
  const contentDiv = document.getElementById('content');

  // 学科一覧からボタンを生成
  Object.keys(rankingData).forEach(dept => {
    const btn = document.createElement('button');
    btn.className = 'dept-btn';
    btn.textContent = dept;
    btn.onclick = () => showRanking(dept, btn);
    btnContainer.appendChild(btn);
  });

  function showRanking(dept, activeBtn) {
    // アクティブなボタンのスタイルを更新
    document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');

    const data = rankingData[dept];

    let html = `
      <span class="subtitle">Similarity Ranking</span>
      <h1>「${dept}」の類似度ランキング</h1>
    `;

    data.forEach((item, index) => {
      // スコアをパーセント表記に（例: 0.9526 -> 95.3）
      const percentage = (item.score * 100).toFixed(1);
      html += `
        <div class="ranking-card" style="animation-delay: ${index * 0.1}s">
          <div class="rank-badge">${item.rank}</div>
          <div class="rank-info">
            <div class="rank-name">${item.target}</div>
            <div class="rank-score">Cosine Similarity: ${item.score.toFixed(4)}</div>
          </div>
          <div class="score-visual">
            <div class="score-bar-container" title="類似度 ${percentage}%">
              <div class="score-bar" style="width: 0%" data-width="${Math.max(2, percentage)}%"></div>
            </div>
            <div class="score-percentage">${percentage}%</div>
          </div>
        </div>
      `;
    });

    // 描画とアニメーションのトリガー
    contentDiv.innerHTML = '';

    // DOMに反映させてからプログレスバーをアニメーションさせる
    setTimeout(() => {
        contentDiv.innerHTML = html;
        setTimeout(() => {
            document.querySelectorAll('.score-bar').forEach(bar => {
                bar.style.width = bar.getAttribute('data-width');
            });
        }, 50);
    }, 10);
  }
