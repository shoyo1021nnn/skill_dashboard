<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル類似度ランキング ＆ レーダーチャート</title>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    color: #333;
  }
  #sidebar {
    width: 280px;
    background-color: #f4f4f4;
    border-right: 1px solid #ccc;
    padding: 20px;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 16px;
    margin-top: 0;
    border-bottom: 1px solid #ccc;
    padding-bottom: 10px;
  }
  .dept-btn {
    display: block;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 5px;
    background-color: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
  }
  .dept-btn:hover { background-color: #e9e9e9; }
  .dept-btn.active {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
  }
  #main {
    flex-grow: 1;
    padding: 30px;
    overflow-y: auto;
  }
  h1 {
    font-size: 24px;
    border-bottom: 2px solid #007bff;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .sort-controls {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #e9ecef;
    border-radius: 8px;
    display: none;
  }
  .sort-controls span {
    font-weight: bold;
    margin-right: 15px;
  }
  .sort-btn {
    padding: 8px 15px;
    margin-right: 10px;
    background-color: white;
    border: 1px solid #ced4da;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .sort-btn:hover { background-color: #e2e6ea; }
  .sort-btn.active { background-color: #28a745; color: white; border-color: #28a745; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 15px;
    text-align: left;
    vertical-align: middle;
  }
  th { background-color: #f8f9fa; }
  .rank-col { width: 60px; text-align: center; }
  .target-col { width: 300px; }
  .score-col { width: 90px; text-align: center; font-weight: bold; font-size: 14px;}

  .highlight-col { background-color: #fff3cd; }

  .chart-col { width: 600px; text-align: center; }
  .chart-container {
    width: 550px;
    height: 400px;
    margin: 0 auto;
  }
  #welcome-msg { color: #666; font-size: 18px; }
  .toggle-btn {
    padding: 6px 12px;
    background-color: #6c757d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .toggle-btn:hover { background-color: #5a6268; }
  .hidden-chart { display: none; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>基準学科を選択</h2>

  </div>

  <div id="content"></div>
</div>

  Object.keys(rankingData).forEach(dept => {
    const btn = document.createElement('button');

      document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));

                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compDeptKey,
                      data: compValues,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: { font: { size: 10 }, color: '#666' }
                  }
              },
              plugins: {
                  legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
              }
          }
      });
      chartInstances.push(radarChart);
    });
  }

  window.toggleChart = function(wrapId, chartId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('hidden-chart')) {
      wrap.classList.remove('hidden-chart');
      const chartInstance = Chart.getChart(chartId);
      if (chartInstance) { chartInstance.resize(); }
    } else {
      wrap.classList.add('hidden-chart');
    }
  }
</script>
</body>
</html>
