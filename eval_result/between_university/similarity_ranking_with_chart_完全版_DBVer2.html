<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    color: #333;
  }
  #sidebar {
    width: 280px;
    background-color: #f4f4f4;
    border-right: 1px solid #ccc;
    padding: 20px;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 16px;
    margin-top: 0;
    border-bottom: 1px solid #ccc;
    padding-bottom: 10px;
  }
  .dept-btn {
    display: block;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 5px;
    background-color: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
  }
  .dept-btn:hover { background-color: #e9e9e9; }
  .dept-btn.active {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
  }
  #main {
    flex-grow: 1;
    padding: 30px;
    overflow-y: auto;
  }
  h1 {
    font-size: 24px;
    border-bottom: 2px solid #007bff;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .sort-controls {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #e9ecef;
    border-radius: 8px;
    display: none;
  }
  .sort-controls span {
    font-weight: bold;
    margin-right: 15px;
  }
  .sort-btn {
    padding: 8px 15px;
    margin-right: 10px;
    background-color: white;
    border: 1px solid #ced4da;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .sort-btn:hover { background-color: #e2e6ea; }
  .sort-btn.active { background-color: #28a745; color: white; border-color: #28a745; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 15px;
    text-align: left;
    vertical-align: middle;
  }
  th { background-color: #f8f9fa; }
  .rank-col { width: 60px; text-align: center; }
  .target-col { width: 300px; }
  .score-col { width: 90px; text-align: center; font-weight: bold; font-size: 14px;}

  .highlight-col { background-color: #fff3cd; }

  .chart-col { width: 700px; text-align: center; }
  .chart-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }
  .chart-wrapper {
    width: 320px;
    height: 320px;
  }
  #welcome-msg { color: #666; font-size: 18px; }
  .toggle-btn {
    padding: 6px 12px;
    background-color: #6c757d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .toggle-btn:hover { background-color: #5a6268; }
  .hidden-chart { display: none; }
</style>
</head>

    </div>
  </div>

  <div id="content"></div>
</div>

        btn.dataset.univ = match[1];
    }
    btn.onclick = (e) => {
      document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentDept = dept;
      welcomeMsg.style.display = 'none';
      sortControls.style.display = 'block'; 

      renderRanking(); 
    };
    btnContainer.appendChild(btn);
    buttons.push(btn);
  });

  univFilter.addEventListener('change', (e) => {
    const selected = e.target.value;
    buttons.forEach(btn => {
      if (selected === 'all' || btn.dataset.univ === selected) {
        btn.style.display = 'block';
      } else {
        btn.style.display = 'none';
      }
    });
  });

  targetFilter.addEventListener('change', () => {
    if (currentDept) {
      renderRanking();
    }
  });

  sortBtns.forEach(btn => {
    btn.onclick = (e) => {
      sortBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentSortKey = e.target.getAttribute('data-sort'); 

      if (currentDept) {
        renderRanking(); 
      }
    };
  });

  function renderRanking() {
    chartInstances.forEach(chart => chart.destroy());
    chartInstances = [];

    let data = [...rankingData[currentDept]];

    // 比較対象の絞り込み処理
    const targetFilterVal = targetFilter.value;
    const currentUnivMatch = currentDept.match(/^【(.*?)】/);
    const currentUniv = currentUnivMatch ? currentUnivMatch[1] : '';

    if (targetFilterVal === 'same' && currentUniv) {
        data = data.filter(item => {
            const itemUnivMatch = item.target.match(/^【(.*?)】/);
            const itemUniv = itemUnivMatch ? itemUnivMatch[1] : '';
            return itemUniv === currentUniv;
        });
    } else if (targetFilterVal === 'diff' && currentUniv) {
        data = data.filter(item => {
            const itemUnivMatch = item.target.match(/^【(.*?)】/);
            const itemUniv = itemUnivMatch ? itemUnivMatch[1] : '';
            return itemUniv !== currentUniv;
        });
    }

    data.sort((a, b) => {
      if (currentSortKey === 'euclid_dist') {
        return a[currentSortKey] - b[currentSortKey];
      } else {
        return b[currentSortKey] - a[currentSortKey];
      }
    });

    const getClass = (key) => currentSortKey === key ? 'score-col highlight-col' : 'score-col';

    let html = `<h1>「${currentDept}」の類似度ランキング</h1>`;
    html += `
      <table>
        <thead>
          <tr>
            <th class="rank-col">順位</th>
            <th class="target-col">比較対象（大学・学科）</th>
            <th class="${getClass('score')}">類似度ｽｺｱ</th>
            <th class="${getClass('dot_score')}">内積ｽｺｱ</th>
            <th class="${getClass('euclid_dist')}">ﾕｰｸﾘｯﾄﾞ距離</th>
            <th class="${getClass('tanimoto_score')}">谷本係数</th>
            <th class="chart-col">レーダーチャート (青: 基準, 赤: 比較対象)</th>
          </tr>
        </thead>
        <tbody>
    `;

    // 全件分をHTMLとして生成
    data.forEach((item, index) => {
      const rank = index + 1;
      html += `
        <tr>
          <td class="rank-col">${rank}</td>
          <td>${item.target}</td>
          <td class="${getClass('score')}">${item.score.toFixed(4)}</td>
          <td class="${getClass('dot_score')}">${item.dot_score.toFixed(4)}</td>
          <td class="${getClass('euclid_dist')}">${item.euclid_dist.toFixed(4)}</td>
          <td class="${getClass('tanimoto_score')}">${item.tanimoto_score.toFixed(4)}</td>
          <td class="chart-col">
            <button class="toggle-btn" onclick="toggleChart('chart-wrap-${index}', 'chartA-${index}', 'chartB-${index}')">グラフを表示 / 非表示</button>
            <div id="chart-wrap-${index}" class="hidden-chart">
              <div class="chart-container">
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 14px; margin-bottom: 5px;">(A) 知識関連</h3>
                  <canvas id="chartA-${index}"></canvas>
                </div>
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 14px; margin-bottom: 5px;">(B) 汎用スキル</h3>
                  <canvas id="chartB-${index}"></canvas>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contentDiv.innerHTML = html;

    // 全件分のレーダーチャートを描画
    data.forEach((item, index) => {
      const compDeptKey = item.target; // NO REGEX REPLACE!
      const targetValuesA = radarData[currentDept] ? radarData[currentDept].values_A : [];
      const compValuesA = radarData[compDeptKey] ? radarData[compDeptKey].values_A : [];

      const targetValuesB = radarData[currentDept] ? radarData[currentDept].values_B : [];
      const compValuesB = radarData[compDeptKey] ? radarData[compDeptKey].values_B : [];

      // A
      const ctxA = document.getElementById(`chartA-${index}`).getContext('2d');
      const radarChartA = new Chart(ctxA, {
          type: 'radar',
          data: {
              labels: chartLabelsA,
              datasets: [
                  {
                      label: currentDept,
                      data: targetValuesA,
                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compDeptKey,
                      data: compValuesA,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: { font: { size: 10 }, color: '#666' }
                  }
              },
              plugins: {
                  legend: { display: false }
              }
          }
      });
      chartInstances.push(radarChartA);

      // B
      const ctxB = document.getElementById(`chartB-${index}`).getContext('2d');
      const radarChartB = new Chart(ctxB, {
          type: 'radar',
          data: {
              labels: chartLabelsB,
              datasets: [
                  {
                      label: currentDept,
                      data: targetValuesB,
                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compDeptKey,
                      data: compValuesB,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: { font: { size: 10 }, color: '#666' }
                  }
              },
              plugins: {
                  legend: { display: false }
              }
          }
      });
      chartInstances.push(radarChartB);
    });
  }

  window.toggleChart = function(wrapId, chartAId, chartBId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('hidden-chart')) {
      wrap.classList.remove('hidden-chart');
      const chartInstanceA = Chart.getChart(chartAId);
      if (chartInstanceA) { chartInstanceA.resize(); }
      const chartInstanceB = Chart.getChart(chartBId);
      if (chartInstanceB) { chartInstanceB.resize(); }
    } else {
      wrap.classList.add('hidden-chart');
    }
  }
</script>
</body>
</html>
