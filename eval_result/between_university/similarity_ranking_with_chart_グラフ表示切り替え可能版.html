  const chartLabels = [["A-1: Education"], ["B-12: Leadership &", "Management"], ["B-11: Computer skills"], ["B-10: Info Processing", "& Digital Literacy"], ["B-9: Expressiveness", "& Presentation"], ["B-8: Creativity"], ["B-7: Adaptability"], ["B-6: Problem Solving"], ["B-5: Self-Management", "& Autonomous Growth"], ["B-4: Ethics"], ["B-3: Language &", "Global Competence"], ["B-2: Critical &", "Logical Thinking"], ["B-1: Teamwork &", "Communication"], ["A-12: Services"], ["A-11: health & Welfare"], ["A-10: Agriculture, Forestry,", "Fisheries & Veterinary"], ["A-9: Hardware Operation", "& Material Handling"], ["A-8: Engineering,", "Manufacturing & Construction"], ["A-7: ICT"], ["A-6: Natural Sciences,", "Math & Statistics"], ["A-5: Business,", "Administration & Law"], ["A-4: Social Sciences,", "Journalism & Informatics"], ["A-3: Arts"], ["A-2: Humanities"]];

  const btnContainer = document.getElementById('btn-container');
  const contentDiv = document.getElementById('content');
  let chartInstances = []; // グラフのインスタンスを管理

  Object.keys(rankingData).forEach(dept => {
    const btn = document.createElement('button');
    btn.className = 'dept-btn';
    btn.textContent = dept;
    btn.onclick = () => showRanking(dept, btn);
    btnContainer.appendChild(btn);
  });

  function showRanking(targetDept, activeBtn) {
    // 既存のチャートを破棄
    chartInstances.forEach(chart => chart.destroy());
    chartInstances = [];

    document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');

    const data = rankingData[targetDept];

    let html = `<h1>「${targetDept}」の類似度ランキング</h1>`;
    html += `
      <table>
        <thead>
          <tr>
            <th class="rank-col">順位</th>
            <th class="target-col">比較対象（大学・学科）</th>
            <th class="score-col">類似度スコア</th>
            <th class="chart-col">レーダーチャート (青: 基準, 赤: 比較対象)</th>
          </tr>
        </thead>
        <tbody>
    `;
    data.forEach((item, index) => {
      html += `
        <tr>
          <td class="rank-col">${item.rank}</td>
          <td>${item.target}</td>
          <td class="score-col">${item.score.toFixed(4)}</td>
          <td class="chart-col">
            <!-- 追加：トグルボタン -->
            <button class="toggle-btn" onclick="toggleChart('chart-wrap-${index}', 'chart-${index}')">グラフを表示 / 非表示</button>

            <!-- 追加：非表示用のラッパー -->
            <div id="chart-wrap-${index}" class="hidden-chart">
              <div class="chart-container">
                <canvas id="chart-${index}"></canvas>
              </div>
            </div>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contentDiv.innerHTML = html;

    // テーブル生成後にChart.jsで描画
    data.forEach((item, index) => {
      // "【univ】 department" の文字列から department を抽出してキーにする
      const compDeptKey = item.target.replace(/^【.*?】\s*/, '');

      const targetValues = radarData[targetDept] ? radarData[targetDept].values : [];
      const compValues = radarData[compDeptKey] ? radarData[compDeptKey].values : [];

      const ctx = document.getElementById(`chart-${index}`).getContext('2d');
      const radarChart = new Chart(ctx, {
          type: 'radar',
          data: {
              labels: chartLabels,
              datasets: [
                  {
                      label: targetDept,
                      data: targetValues,
                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compDeptKey,
                      data: compValues,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: {
                          font: { size: 10 },
                          color: '#666'
                      }
                  }
              },
              plugins: {
                  legend: {
                      position: 'bottom',
                      labels: { boxWidth: 12, font: { size: 10 } }
                  }
              }
          }
      });
      chartInstances.push(radarChart);
    });
  }
    // グラフの表示・非表示を切り替える関数
  function toggleChart(wrapId, chartId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('hidden-chart')) {
      // 非表示を解除
      wrap.classList.remove('hidden-chart');
      // 表示された瞬間にグラフのサイズを再計算させる（描画崩れ防止）
      const chartInstance = Chart.getChart(chartId);
      if (chartInstance) {
          chartInstance.resize();
      }
    } else {
      // 再び非表示にする
      wrap.classList.add('hidden-chart');
    }
  }
