    const universities = new Set();
    Object.keys(dataDict).forEach(key => {

    });

    Array.from(universities).sort().forEach(univ => {

        univ2Select.appendChild(opt2);
    });

    // 選択された大学に基づいて学部のリストを更新
    function populateDepts(univFilter, deptSelect, defaultIndex = 0) {
        deptSelect.innerHTML = '';
        let count = 0;
        let selectedIndexToSet = 0;
        Object.keys(dataDict).sort().forEach(dept => {
            if (univFilter === 'all' || dept.startsWith(univFilter + ' - ')) {
                const text = `${dept} (Subjects: ${dataDict[dept].subjects})`;
                const opt = document.createElement('option');
                opt.value = dept;
                opt.textContent = text;
                deptSelect.appendChild(opt);
                
                if (count === defaultIndex) {
                    opt.selected = true;
                    selectedIndexToSet = count;
                }
                count++;
            }
        });
        if (deptSelect.options.length > 0 && selectedIndexToSet !== defaultIndex) {
            deptSelect.selectedIndex = 0;
        }
    }

    populateDepts('all', dept1Select, 0);
    populateDepts('all', dept2Select, 1);

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            r: {
                min: 0,
                max: 3,
                ticks: {
                    stepSize: 0.5,
                    backdropColor: 'transparent'
                },
                pointLabels: {
                    font: {
                        size: 11,
                        weight: 'bold'
                    },
                    color: '#475569'
                }
            }
        },
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    font: {
                        size: 14,
                        weight: 'bold'
                    }
                }
            }
        }
    };

    function createDataset(label, colorRGB) {
        return {
            label: label,
            data: [],
            backgroundColor: `rgba(${colorRGB}, 0.2)`,
            borderColor: `rgba(${colorRGB}, 1)`,
            borderWidth: 2,
            pointBackgroundColor: `rgba(${colorRGB}, 1)`,
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: `rgba(${colorRGB}, 1)`
        };
    }

    const ctxA = document.getElementById('radarChartA').getContext('2d');
    const radarChartA = new Chart(ctxA, {
        type: 'radar',
        data: {
            labels: labelsA,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: {
                    display: true,
                    text: '知識関連スキル (A-1〜A-12)',
                    font: { size: 18 }
                }
            }
        }
    });

    const ctxB = document.getElementById('radarChartB').getContext('2d');
    const radarChartB = new Chart(ctxB, {
        type: 'radar',
        data: {
            labels: labelsB,
            datasets: [
                createDataset('', '54, 162, 235'),
                createDataset('', '255, 99, 132')
            ]
        },
        options: {
            ...commonOptions,
            plugins: {
                ...commonOptions.plugins,
                title: {
                    display: true,
                    text: '汎用スキル関連 (B-1〜B-12)',
                    font: { size: 18 }
                }
            }
        }
    });

    function updateChart() {
        const val1 = dept1Select.value;
        const val2 = dept2Select.value;

        if (val1 && dataDict[val1]) {
            radarChartA.data.datasets[0].label = val1;
            radarChartA.data.datasets[0].data = dataDict[val1].values_A;
            radarChartB.data.datasets[0].label = val1;
            radarChartB.data.datasets[0].data = dataDict[val1].values_B;
        }
        if (val2 && dataDict[val2]) {
            radarChartA.data.datasets[1].label = val2;
            radarChartA.data.datasets[1].data = dataDict[val2].values_A;
            radarChartB.data.datasets[1].label = val2;
            radarChartB.data.datasets[1].data = dataDict[val2].values_B;
        }
        radarChartA.update();
        radarChartB.update();
    }

    univ1Select.addEventListener('change', (e) => {
        populateDepts(e.target.value, dept1Select, 0);
        updateChart();
    });
    univ2Select.addEventListener('change', (e) => {
        populateDepts(e.target.value, dept2Select, 0);
        updateChart();
    });
    
    dept1Select.addEventListener('change', updateChart);
    dept2Select.addEventListener('change', updateChart);

    updateChart();
</script>

</body>
</html>
