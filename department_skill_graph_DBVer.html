    function populateDept(deptSelect, univFilter, defaultIndex) {
        const currentVal = deptSelect.value;
        deptSelect.innerHTML = '';
        let matchedDepts = allDepts;
        if (univFilter !== 'all') {
            matchedDepts = allDepts.filter(dept => dept.includes(`[${univFilter}]`));
        }

        let foundCurrent = false;
        matchedDepts.forEach((dept, idx) => {
            const text = `${dept} (Subjects: ${dataDict[dept].subjects})`;
            const opt = document.createElement('option');
            opt.value = dept;
            opt.textContent = text;
            deptSelect.appendChild(opt);

            if (currentVal === dept) {
                opt.selected = true;
                foundCurrent = true;
            }
        });

        if (!foundCurrent && matchedDepts.length > 0) {
            if (defaultIndex < matchedDepts.length) {
                deptSelect.selectedIndex = defaultIndex;
            } else {
                deptSelect.selectedIndex = 0;
            }
        }

        } else if (normMode === 'max_24') {
            keyA = 'values_A_max_24';
            keyB = 'values_B_max_24';
            maxScale = 1.0;
            stepScale = 0.2;
        } else if (normMode === 'l1_ind') {
            keyA = 'values_A_l1_ind';
            keyB = 'values_B_l1_ind';
            maxScale = undefined;
            stepScale = undefined;
        } else if (normMode === 'max_ind') {
            keyA = 'values_A_max_ind';
            keyB = 'values_B_max_ind';
            maxScale = 1.0;
            stepScale = 0.2;
        }

        radarChartA.options.scales.r.max = maxScale;
        radarChartA.options.scales.r.ticks.stepSize = stepScale;
        radarChartB.options.scales.r.max = maxScale;
        radarChartB.options.scales.r.ticks.stepSize = stepScale;
        radarChartAll.options.scales.r.max = maxScale;
        radarChartAll.options.scales.r.ticks.stepSize = stepScale;

        if (dataDict[val1]) {
            const data1A = dataDict[val1][keyA];
            const data1B = dataDict[val1][keyB];
            const label1 = `${val1} (${dataDict[val1].subjects} sub)`;

            radarChartA.data.datasets[0].label = label1;
            radarChartA.data.datasets[0].data = data1A;
            radarChartB.data.datasets[0].label = label1;
            radarChartB.data.datasets[0].data = data1B;
            radarChartAll.data.datasets[0].label = label1;
            radarChartAll.data.datasets[0].data = [...data1A, ...data1B];
        }
        if (dataDict[val2]) {
            const data2A = dataDict[val2][keyA];
            const data2B = dataDict[val2][keyB];
            const label2 = `${val2} (${dataDict[val2].subjects} sub)`;

            radarChartA.data.datasets[1].label = label2;
            radarChartA.data.datasets[1].data = data2A;
            radarChartB.data.datasets[1].label = label2;
            radarChartB.data.datasets[1].data = data2B;
            radarChartAll.data.datasets[1].label = label2;
            radarChartAll.data.datasets[1].data = [...data2A, ...data2B];
        }

        radarChartA.update();
        radarChartB.update();
        radarChartAll.update();
    }

    dept1Select.addEventListener('change', updateChart);
    dept2Select.addEventListener('change', updateChart);
    const modeRadiosAll = document.querySelectorAll('input[type="radio"]');
    modeRadiosAll.forEach(radio => radio.addEventListener('change', updateChart));

    updateChart();
</script>

</body>
</html>
