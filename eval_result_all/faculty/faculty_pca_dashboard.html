
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Faculty PCA Clustering Dashboard</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  .switch-container { display: flex; align-items: center; margin-bottom: 20px; }
  .switch { position: relative; display: inline-block; width: 60px; height: 34px; margin: 0 15px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2196F3; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: #4CAF50; }
  input:checked + .slider:before { transform: translateX(26px); }
  .switch-label { font-size: 18px; font-weight: bold; }
  .active-label { color: #333; }
  .inactive-label { color: #aaa; }

  .tab { overflow: hidden; border: 1px solid #ccc; background-color: #f1f1f1; margin-bottom: 10px; }
  .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; font-size: 17px; }
  .tab button:hover { background-color: #ddd; }
  .tab button.active { background-color: #ccc; }
  .tabcontent { display: none; padding: 0; border: 1px solid #ccc; height: 800px; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<h2>Faculty PCA Clustering Results Dashboard</h2>

<div class="switch-container">
  <span id="label-l1" class="switch-label active-label">L1正規化</span>
  <label class="switch">
    <input type="checkbox" id="normToggle" onchange="toggleNorm()">
    <span class="slider"></span>
  </label>
  <span id="label-l2" class="switch-label inactive-label">L2正規化</span>
</div>

<div class="tab">
<button class="tablinks active" onclick="openTab(event, 0)">Top 1</button>
<button class="tablinks" onclick="openTab(event, 1)">Top 2</button>
<button class="tablinks" onclick="openTab(event, 2)">Top 3</button>
<button class="tablinks" onclick="openTab(event, 3)">Top 4</button>
<button class="tablinks" onclick="openTab(event, 4)">Top 5</button>
</div>

<div id="tab0" class="tabcontent" style="display: block;">
  <iframe id="iframe0" src="pca/faculty_pca_cluster_l1_top_k14.html" data-l1="pca/faculty_pca_cluster_l1_top_k14.html" data-l2="pca/faculty_pca_cluster_l2_top_k14.html"></iframe>
</div>

<div id="tab1" class="tabcontent" style="display: none;">
  <iframe id="iframe1" src="pca/faculty_pca_cluster_l1_top_k3.html" data-l1="pca/faculty_pca_cluster_l1_top_k3.html" data-l2="pca/faculty_pca_cluster_l2_top_k3.html"></iframe>
</div>

<div id="tab2" class="tabcontent" style="display: none;">
  <iframe id="iframe2" src="pca/faculty_pca_cluster_l1_top_k15.html" data-l1="pca/faculty_pca_cluster_l1_top_k15.html" data-l2="pca/faculty_pca_cluster_l2_top_k13.html"></iframe>
</div>

<div id="tab3" class="tabcontent" style="display: none;">
  <iframe id="iframe3" src="pca/faculty_pca_cluster_l1_top_k5.html" data-l1="pca/faculty_pca_cluster_l1_top_k5.html" data-l2="pca/faculty_pca_cluster_l2_top_k5.html"></iframe>
</div>

<div id="tab4" class="tabcontent" style="display: none;">
  <iframe id="iframe4" src="pca/faculty_pca_cluster_l1_top_k13.html" data-l1="pca/faculty_pca_cluster_l1_top_k13.html" data-l2="pca/faculty_pca_cluster_l2_top_k11.html"></iframe>
</div>

<script>
function toggleNorm() {
  const isL2 = document.getElementById("normToggle").checked;
  document.getElementById("label-l1").className = isL2 ? "switch-label inactive-label" : "switch-label active-label";
  document.getElementById("label-l2").className = isL2 ? "switch-label active-label" : "switch-label inactive-label";

  for(let i=0; i<5; i++) {
    const iframe = document.getElementById("iframe" + i);
    iframe.src = isL2 ? iframe.getAttribute("data-l2") : iframe.getAttribute("data-l1");
  }
}

function openTab(evt, tabIndex) {
  const tabcontent = document.getElementsByClassName("tabcontent");
  for (let i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  const tablinks = document.getElementsByClassName("tablinks");
  for (let i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById("tab" + tabIndex).style.display = "block";
  evt.currentTarget.className += " active";
}
</script>
</body>
</html>
