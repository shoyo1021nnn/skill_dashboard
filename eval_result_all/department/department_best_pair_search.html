<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル補完システム（ベスト・ペア検索）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; color: #333; }
  #sidebar { width: 280px; background-color: #f4f4f4; border-right: 1px solid #ccc; padding: 20px; overflow-y: auto; }
  #sidebar h2 { font-size: 16px; margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
  .dept-btn { display: block; width: 100%; padding: 8px 10px; margin-bottom: 5px; background-color: white; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; text-align: left; font-size: 14px; }
  .dept-btn:hover { background-color: #e9e9e9; }
  .dept-btn.active { background-color: #007bff; color: white; border-color: #007bff; }
  #main { flex-grow: 1; padding: 30px; overflow-y: auto; }
  h1 { font-size: 24px; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
  
  .mode-controls { margin-bottom: 20px; padding: 15px; background-color: #e9ecef; border-radius: 8px; display: none; }
  
  .control-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .control-group span { font-weight: bold; width: 120px; }
  .control-select { padding: 5px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; width: 220px; }

  .explanation { margin-top: 10px; font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 4px; border-left: 4px solid #28a745; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; font-size: 14px;}
  th { background-color: #f8f9fa; }
  .rank-col { width: 50px; text-align: center; }
  .score-col { width: 80px; text-align: center; font-weight: bold; }
  .highlight-col { background-color: #fff3cd; }
  
  .chart-col { width: 600px; text-align: center; }
  .chart-container { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .chart-wrapper { width: 280px; height: 280px; }
  #welcome-msg { color: #666; font-size: 18px; }
  .toggle-btn { padding: 6px 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 5px; }
  .toggle-btn:hover { background-color: #5a6268; }
  .hidden-chart { display: none; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>基準学科を選択</h2>
  <select id="univ-filter" style="width: 100%; margin-bottom: 10px; padding: 5px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc;">
    <option value="all">すべての大学</option>
  </select>
  <div id="btn-container"></div>
</div>

<div id="main">
  <div id="welcome-msg">左のリストから基準となる学科を選択してください。</div>
  
  <div id="mode-controls" class="mode-controls">
    <div class="control-group">
      <span>ベクトル結合方法:</span>
      <select id="combine-method" class="control-select">
        <option value="max">最大値 (maximum)</option>
        <option value="mean">平均値 (average)</option>
      </select>
    </div>
    <div class="control-group">
      <span>ランキング指標:</span>
      <select id="similarity-metric" class="control-select">
        <option value="coverage">カバー率 (理想-現在のギャップ)</option>
        <option value="cosine">コサイン類似度 (対ギャップ)</option>
        <option value="tanimoto">谷本係数 (対ギャップ)</option>
      </select>
    </div>
    <div class="control-group">
      <span>比較対象の範囲:</span>
      <select id="target-filter" class="control-select">
        <option value="all">すべての大学</option>
        <option value="same">同じ大学の学部のみ</option>
        <option value="diff">同じ大学の学部を除く</option>
      </select>
    </div>
    <div id="mode-explanation" class="explanation"></div>
  </div>
  
  <div id="content"></div>
</div>

  // 数学的なヘルパー関数
  function dot(v1, v2) {
    let sum = 0;
    for (let i = 0; i < v1.length; i++) sum += v1[i] * v2[i];
    return sum;
  }
  function norm(v) {
    let sum = 0;
    for (let i = 0; i < v.length; i++) sum += v[i] * v[i];
    return Math.sqrt(sum);
  }
  function cosine(v1, v2) {
    const n1 = norm(v1);
    const n2 = norm(v2);
    if (n1 === 0 || n2 === 0) return 0;
    return dot(v1, v2) / (n1 * n2);
  }
  function tanimoto(v1, v2) {
    const d = dot(v1, v2);
    const n1_2 = dot(v1, v1);
    const n2_2 = dot(v2, v2);
    const denom = n1_2 + n2_2 - d;
    if (denom === 0) return 0;
    return d / denom;
  }
  function coverage(gap, comb) {
    let num = 0;
    let den = 0;
    for (let i = 0; i < gap.length; i++) {
      num += Math.min(gap[i], comb[i]);
      den += gap[i];
    }
    if (den === 0) return 1.0;
    return num / den;
  }

    if (targetFilterVal === 'same' && currentUniv) {
      candidates = candidates.filter(dept => dept.includes(`【${currentUniv}】`));
    } else if (targetFilterVal === 'diff' && currentUniv) {
      candidates = candidates.filter(dept => !dept.includes(`【${currentUniv}】`));
    }

    const targetVecA = radarData[currentDept].values_A;
    const targetVecB = radarData[currentDept].values_B;

    // 理想ベクトル（汎用スキル全て3.0）に対する基準学科のギャップを算出
    const gapB = targetVecB.map(v => Math.max(0, 3.0 - v));

    // 2. 全ペアを生成してスコア計算
    const pairs = [];
    const len = candidates.length;
    for (let i = 0; i < len; i++) {
      for (let j = i + 1; j < len; j++) {
        const dept1 = candidates[i];
        const dept2 = candidates[j];

        const vec1A = radarData[dept1].values_A;
        const vec2A = radarData[dept2].values_A;
        const vec1B = radarData[dept1].values_B;
        const vec2B = radarData[dept2].values_B;

        // B (汎用) ベクトルの結合
        let combB = [];
        if (combineMethodVal === 'max') {
          for (let k = 0; k < 12; k++) combB.push(Math.max(vec1B[k], vec2B[k]));
        } else {
          for (let k = 0; k < 12; k++) combB.push((vec1B[k] + vec2B[k]) / 2);
        }

        // A (知識) ベクトルの結合
        let combA = [];
        if (combineMethodVal === 'max') {
          for (let k = 0; k < 12; k++) combA.push(Math.max(vec1A[k], vec2A[k]));
        } else {
          for (let k = 0; k < 12; k++) combA.push((vec1A[k] + vec2A[k]) / 2);
        }

        const scoreCosine = cosine(gapB, combB);
        const scoreTanimoto = tanimoto(gapB, combB);
        const scoreCoverage = coverage(gapB, combB);
        const simA = cosine(targetVecA, combA);

        pairs.push({
          dept1,
          dept2,
          scoreCosine,
          scoreTanimoto,
          scoreCoverage,
          simA,
          combA,
          combB
        });
      }
    }

    // 3. ソート
    if (metricVal === 'cosine') {
      pairs.sort((a, b) => b.scoreCosine - a.scoreCosine);
    } else if (metricVal === 'tanimoto') {
      pairs.sort((a, b) => b.scoreTanimoto - a.scoreTanimoto);
    } else if (metricVal === 'coverage') {
      pairs.sort((a, b) => b.scoreCoverage - a.scoreCoverage);
    }

    // 上位30組を抽出
    const topPairs = pairs.slice(0, 30);

    const getHighlightClass = (col) => {
      return (metricVal === col) ? 'score-col highlight-col' : 'score-col';
    };

    let html = `<h1>「${currentDept}」のスキル補完ベスト・ペア（2学科の組み合わせ）ランキング</h1>`;
    html += `
      <table>
        <thead>
          <tr>
            <th class="rank-col">順位</th>
            <th>補完ペア（学科A ＋ 学科B）</th>
            <th class="${getHighlightClass('coverage')}">カバー率</th>
            <th class="${getHighlightClass('cosine')}">コサイン類似度<br>(対ギャップ)</th>
            <th class="${getHighlightClass('tanimoto')}">谷本係数<br>(対ギャップ)</th>
            <th class="score-col">知識(A)<br>類似度</th>
            <th class="chart-col">レーダーチャート (青:基準, 赤:結合, 緑:ペアA, 橙:ペアB)</th>
          </tr>
        </thead>
        <tbody>
    `;

    topPairs.forEach((pair, index) => {
      html += `
        <tr>
          <td class="rank-col">${index + 1}</td>
          <td>
            <div style="font-weight: bold;">${pair.dept1}</div>
            <div style="font-weight: bold; margin-top: 4px;">${pair.dept2}</div>
          </td>
          <td class="${getHighlightClass('coverage')}">${pair.scoreCoverage.toFixed(3)}</td>
          <td class="${getHighlightClass('cosine')}">${pair.scoreCosine.toFixed(3)}</td>
          <td class="${getHighlightClass('tanimoto')}">${pair.scoreTanimoto.toFixed(3)}</td>
          <td class="score-col">${pair.simA.toFixed(3)}</td>
          <td class="chart-col">
            <button class="toggle-btn" onclick="toggleChart('chart-wrap-${index}', 'chartA-${index}', 'chartB-${index}')">グラフを表示 / 非表示</button>
            <div id="chart-wrap-${index}" class="hidden-chart">
              <div class="chart-container">
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 12px; margin: 0;">(A) 知識関連</h3>
                  <canvas id="chartA-${index}"></canvas>
                </div>
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 12px; margin: 0;">(B) 汎用スキル</h3>
                  <canvas id="chartB-${index}"></canvas>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contentDiv.innerHTML = html;

    // レーダーチャートの描画
    topPairs.forEach((pair, index) => {
      const vec1A = radarData[pair.dept1].values_A;
      const vec2A = radarData[pair.dept2].values_A;
      const vec1B = radarData[pair.dept1].values_B;
      const vec2B = radarData[pair.dept2].values_B;

      const renderRadar = (ctxId, labels, targetData, combinedData, pair1Data, pair2Data) => {
        const ctx = document.getElementById(ctxId).getContext('2d');
        const chart = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: labels,
            datasets: [
              { label: currentDept, data: targetData, backgroundColor: 'rgba(54, 162, 235, 0.1)', borderColor: 'rgba(54, 162, 235, 1)', borderWidth: 2, pointRadius: 2 },
              { label: '結合ベクトル', data: combinedData, backgroundColor: 'rgba(255, 99, 132, 0.15)', borderColor: 'rgba(255, 99, 132, 1)', borderWidth: 2, pointRadius: 2 },
              { label: pair.dept1, data: pair1Data, backgroundColor: 'transparent', borderColor: 'rgba(40, 167, 69, 0.5)', borderWidth: 1, borderDash: [2, 2], pointRadius: 1 },
              { label: pair.dept2, data: pair2Data, backgroundColor: 'transparent', borderColor: 'rgba(253, 126, 20, 0.5)', borderWidth: 1, borderDash: [2, 2], pointRadius: 1 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                min: 0, max: 3,
                ticks: { stepSize: 1, display: false },
                pointLabels: { font: { size: 9 }, color: '#666' }
              }
            },
            plugins: { legend: { display: false } }
          }
        });
        chartInstances.push(chart);
      };

      renderRadar(`chartA-${index}`, chartLabelsA, targetVecA, pair.combA, vec1A, vec2A);
      renderRadar(`chartB-${index}`, chartLabelsB, targetVecB, pair.combB, vec1B, vec2B);
    });
  }

  window.toggleChart = function(wrapId, chartAId, chartBId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('hidden-chart')) {
      wrap.classList.remove('hidden-chart');
      const chartInstanceA = Chart.getChart(chartAId);
      if (chartInstanceA) chartInstanceA.resize();
      const chartInstanceB = Chart.getChart(chartBId);
      if (chartInstanceB) chartInstanceB.resize();
    } else {
      wrap.classList.add('hidden-chart');
    }
  }
</script>
</body>
</html>
