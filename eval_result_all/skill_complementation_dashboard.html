<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スキル補完検索 ダッシュボード</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f8f9fa; }
        .header { background-color: #343a40; color: white; padding: 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .tabs { display: flex; background-color: #e9ecef; border-bottom: 2px solid #dee2e6; }
        .tab-btn { flex: 1; padding: 15px; border: none; background-color: inherit; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: bold; color: #495057; }
        .tab-btn:hover { background-color: #dee2e6; }
        .tab-btn.active { background-color: white; border-bottom: 3px solid #007bff; color: #007bff; }
        .iframe-container { flex-grow: 1; position: relative; }
        iframe { position: absolute; width: 100%; height: 100%; border: none; display: none; }
        iframe.active { display: block; }
    </style>
</head>
<body>

<div class="header">
    <h1>スキル補完検索 ダッシュボード（学科・学部・大学レベル）</h1>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('dept')">学科レベル</button>
    <button class="tab-btn" onclick="openTab('faculty')">学部レベル</button>
    <button class="tab-btn" onclick="openTab('univ')">大学レベル</button>
</div>

<div class="iframe-container">
    <iframe id="iframe-dept" src="department/department_skill_complementation_search_Ver.html" class="active"></iframe>
    <iframe id="iframe-faculty" src="faculty/faculty_skill_complementation_search.html"></iframe>
    <iframe id="iframe-univ" src="university/university_skill_complementation_search.html"></iframe>
</div>

<script>
    function openTab(tabName) {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => tab.classList.remove('active'));

        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(iframe => iframe.classList.remove('active'));

        if (tabName === 'dept') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('iframe-dept').classList.add('active');
        } else if (tabName === 'faculty') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('iframe-faculty').classList.add('active');
        } else if (tabName === 'univ') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('iframe-univ').classList.add('active');
        }
    }
</script>

</body>
</html>
