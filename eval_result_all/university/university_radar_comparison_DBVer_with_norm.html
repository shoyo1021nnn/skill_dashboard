        }
        if (dataDict[val2]) {
            radarChartA.data.datasets[1].label = val2;
            radarChartA.data.datasets[1].data = dataDict[val2][keyA];
            radarChartB.data.datasets[1].label = val2;
            radarChartB.data.datasets[1].data = dataDict[val2][keyB];
        }

        // update combined chart
        if (dataDict[val1]) {
            radarChartAll.data.datasets[0].label = val1;
            radarChartAll.data.datasets[0].data = [...dataDict[val1][keyA], ...dataDict[val1][keyB]];
        }
        if (dataDict[val2]) {
            radarChartAll.data.datasets[1].label = val2;
            radarChartAll.data.datasets[1].data = [...dataDict[val2][keyA], ...dataDict[val2][keyB]];
        }

        // scale options
        let maxScale = 3;
        if (normMode === 'l1_24' || normMode === 'l1_ind') {
            maxScale = (normMode === 'l1_24') ? 0.3 : 0.5;
            commonOptions.scales.r.ticks.stepSize = 0.1;
        } else if (normMode === 'max_24' || normMode === 'max_ind') {
            maxScale = 1;
            commonOptions.scales.r.ticks.stepSize = 0.2;
        } else {
            maxScale = 3;
            commonOptions.scales.r.ticks.stepSize = 0.5;
        }

        [radarChartA, radarChartB, radarChartAll].forEach(chart => {
            chart.options.scales.r.max = maxScale;
            chart.options.scales.r.ticks.stepSize = commonOptions.scales.r.ticks.stepSize;
            chart.update();
        });

        document.getElementById('chart-split-view').style.display = viewMode === 'split' ? 'flex' : 'none';
        document.getElementById('chart-combined-view').style.display = viewMode === 'combined' ? 'block' : 'none';
    }

    univ1Select.addEventListener('change', updateChart);
    univ2Select.addEventListener('change', updateChart);

    document.querySelectorAll('input[name="norm_mode"]').forEach(radio => {
        radio.addEventListener('change', updateChart);
    });
    document.querySelectorAll('input[name="view_mode"]').forEach(radio => {
        radio.addEventListener('change', updateChart);
    });

    updateChart();
</script>

</body>
</html>
