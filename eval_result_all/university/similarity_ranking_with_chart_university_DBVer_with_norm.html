
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル類似度ランキング ＆ レーダーチャート</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    display: flex;
    height: 100vh;
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
  }
  #sidebar {
    width: 280px;
    background-color: #f4f4f4;
    border-right: 1px solid #ccc;
    padding: 20px;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 16px;
    margin-top: 0;
    border-bottom: 1px solid #ccc;
    padding-bottom: 10px;
  }
  .univ-btn {
    display: block;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 5px;
    background-color: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
  }
  .univ-btn:hover { background-color: #e9e9e9; }
  .univ-btn.active {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
  }
  #main {
    flex-grow: 1;
    padding: 30px;
    overflow-y: auto;
  }
  h1 {
    font-size: 24px;
    border-bottom: 2px solid #007bff;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .sort-controls {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #e9ecef;
    border-radius: 8px;
    display: none;
  }
  .sort-controls span {
    font-weight: bold;
    margin-right: 15px;
  }
  .sort-btn {
    padding: 8px 15px;
    margin-right: 10px;
    background-color: white;
    border: 1px solid #ced4da;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .sort-btn:hover { background-color: #e2e6ea; }
  .sort-btn.active { background-color: #28a745; color: white; border-color: #28a745; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 15px;
    text-align: left;
    vertical-align: middle;
  }
  th { background-color: #f8f9fa; }
  .rank-col { width: 60px; text-align: center; }
  .target-col { width: 300px; }
  .score-col { width: 90px; text-align: center; font-weight: bold; font-size: 14px;}

  .highlight-col { background-color: #fff3cd; }

  .chart-col { width: 700px; text-align: center; }
  .chart-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }
  .chart-wrapper {
    width: 320px;
    height: 320px;
  }
  #welcome-msg { color: #666; font-size: 18px; }
  .toggle-btn {
    padding: 6px 12px;
    background-color: #6c757d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .toggle-btn:hover { background-color: #5a6268; }
  .hidden-chart { display: none; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>正規化手法</h2>
  <div style="margin-bottom: 20px;">
    <select id="norm-filter" style="width: 100%; padding: 5px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc;">
      <option value="l1">L1正規化</option>
      <option value="l2">L2正規化</option>
    </select>
  </div>
    <h2>基準大学を選択</h2>
    <div id="btn-container"></div>
  </div>

<div id="main">
  <div id="welcome-msg">左のリストから基準となる大学を選択してください。</div>

  <div id="sort-controls" class="sort-controls">
    <div style="margin-bottom: 10px;">
      <span>ランキング基準：</span>
      <button class="sort-btn active" data-sort="score">コサイン類似度</button>
      <button class="sort-btn" data-sort="dot_score">内積</button>
      <button class="sort-btn" data-sort="euclid_dist">ユークリッド距離</button>
      <button class="sort-btn" data-sort="tanimoto_score">谷本係数</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
  const rankingDataL1 = {"中部大学": [{"target": "九州大学", "score": 0.97291850603391, "dot_score": 0.055901641848248126, "euclid_dist": 0.05624180718881197, "tanimoto_score": 0.9464462294378599}, {"target": "名古屋大学", "score": 0.9836398078463423, "dot_score": 0.05749560786629951, "euclid_dist": 0.04518317646756348, "tanimoto_score": 0.9657101292265309}, {"target": "東京外国語大学", "score": 0.9163890758182083, "dot_score": 0.06026150962662281, "euclid_dist": 0.11307431485405599, "tanimoto_score": 0.8249654716777367}], "九州大学": [{"target": "中部大学", "score": 0.97291850603391, "dot_score": 0.055901641848248126, "euclid_dist": 0.05624180718881197, "tanimoto_score": 0.9464462294378599}, {"target": "名古屋大学", "score": 0.9894439677097192, "dot_score": 0.05958485609579185, "euclid_dist": 0.03590409121874474, "tanimoto_score": 0.978823379520752}, {"target": "東京外国語大学", "score": 0.8621584405825735, "dot_score": 0.05841082014294622, "euclid_dist": 0.14111435234091896, "tanimoto_score": 0.7457581240020823}], "名古屋大学": [{"target": "中部大学", "score": 0.9836398078463423, "dot_score": 0.05749560786629951, "euclid_dist": 0.04518317646756348, "tanimoto_score": 0.9657101292265309}, {"target": "九州大学", "score": 0.9894439677097192, "dot_score": 0.05958485609579185, "euclid_dist": 0.03590409121874474, "tanimoto_score": 0.978823379520752}, {"target": "東京外国語大学", "score": 0.9030932856552636, "dot_score": 0.06224282671824278, "euclid_dist": 0.11964764051974505, "tanimoto_score": 0.813011223137553}], "東京外国語大学": [{"target": "中部大学", "score": 0.9163890758182083, "dot_score": 0.06026150962662281, "euclid_dist": 0.11307431485405603, "tanimoto_score": 0.8249654716777367}, {"target": "九州大学", "score": 0.8621584405825735, "dot_score": 0.05841082014294622, "euclid_dist": 0.14111435234091896, "tanimoto_score": 0.7457581240020823}, {"target": "名古屋大学", "score": 0.9030932856552636, "dot_score": 0.06224282671824278, "euclid_dist": 0.11964764051974508, "tanimoto_score": 0.813011223137553}]};
  const rankingDataL2 = {"中部大学": [{"target": "九州大学", "score": 0.9729185060339101, "dot_score": 0.9729185060339101, "euclid_dist": 0.23272943073917426, "tanimoto_score": 0.9472651496520554}, {"target": "名古屋大学", "score": 0.9836398078463424, "dot_score": 0.9836398078463423, "euclid_dist": 0.18088776715774696, "tanimoto_score": 0.967806309684574}, {"target": "東京外国語大学", "score": 0.9163890758182083, "dot_score": 0.9163890758182083, "euclid_dist": 0.4089276810923705, "tanimoto_score": 0.8456809123297372}], "九州大学": [{"target": "中部大学", "score": 0.9729185060339101, "dot_score": 0.9729185060339101, "euclid_dist": 0.23272943073917426, "tanimoto_score": 0.9472651496520554}, {"target": "名古屋大学", "score": 0.9894439677097194, "dot_score": 0.9894439677097194, "euclid_dist": 0.1452999125277137, "tanimoto_score": 0.9791084661462838}, {"target": "東京外国語大学", "score": 0.8621584405825735, "dot_score": 0.8621584405825735, "euclid_dist": 0.5250553483537266, "tanimoto_score": 0.757713965260931}], "名古屋大学": [{"target": "中部大学", "score": 0.9836398078463424, "dot_score": 0.9836398078463423, "euclid_dist": 0.18088776715774696, "tanimoto_score": 0.967806309684574}, {"target": "九州大学", "score": 0.9894439677097194, "dot_score": 0.9894439677097194, "euclid_dist": 0.1452999125277137, "tanimoto_score": 0.9791084661462838}, {"target": "東京外国語大学", "score": 0.9030932856552638, "dot_score": 0.9030932856552636, "euclid_dist": 0.4402424657952396, "tanimoto_score": 0.8233091046137312}], "東京外国語大学": [{"target": "中部大学", "score": 0.9163890758182083, "dot_score": 0.9163890758182083, "euclid_dist": 0.4089276810923705, "tanimoto_score": 0.8456809123297372}, {"target": "九州大学", "score": 0.8621584405825735, "dot_score": 0.8621584405825735, "euclid_dist": 0.5250553483537266, "tanimoto_score": 0.757713965260931}, {"target": "名古屋大学", "score": 0.9030932856552638, "dot_score": 0.9030932856552636, "euclid_dist": 0.4402424657952396, "tanimoto_score": 0.8233091046137312}]};
  let rankingData = rankingDataL1;
  const radarData = {"中部大学": {"values_A": [0.9393620039682541, 0.7646465277777779, 0.327646626984127, 1.3490550595238096, 0.7379671626984127, 0.9871944444444445, 0.6586012896825397, 0.48911706349206346, 0.370686507936508, 0.09810724206349207, 0.7211158730158731, 0.2703338293650794], "values_B": [1.9581933531746032, 2.319017956349206, 1.4476064484126985, 0.9338015873015872, 2.0708299603174605, 1.911251488095238, 1.0244636904761906, 0.6544358134920635, 1.6775983134920633, 1.3898982142857144, 0.6885457341269842, 0.8596818452380952]}, "九州大学": {"values_A": [0.4221984676434677, 0.46572398046398045, 0.20689397435897436, 0.9450825071225071, 0.5564183821733821, 1.6842925518925518, 0.500655522995523, 0.5868737464387463, 0.5382261172161172, 0.21365564102564102, 1.1564637362637362, 0.07014552706552707], "values_B": [1.635443258038258, 2.3951492551892555, 1.4089892836792837, 0.861508431013431, 1.8861510073260073, 1.9682987382987382, 0.9053402096052097, 0.5992200203500203, 1.3784613980463982, 1.0710787952787952, 0.593055522995523, 0.5299057020757021]}, "名古屋大学": {"values_A": [0.41184000000000004, 0.62846, 0.11773, 1.13413, 0.58243, 1.40952, 0.5518799999999999, 0.45200000000000007, 0.31774, 0.23635, 0.56332, 0.04257], "values_B": [1.64624, 2.43794, 1.3603, 0.66356, 1.7113299999999998, 1.9167100000000001, 0.86603, 0.56275, 1.4819499999999999, 1.09607, 0.595, 0.52095]}, "東京外国語大学": {"values_A": [0.6463, 1.9852999999999998, 0.29686666666666667, 1.4316333333333333, 0.2374333333333333, 0.16336666666666666, 0.21566666666666667, 0.0175, 0.02606666666666667, 0.010366666666666666, 0.11386666666666667, 0.0202], "values_B": [1.8501, 2.4248, 2.3811, 0.5605, 1.6796, 1.373, 0.7904666666666667, 0.6377333333333334, 1.8691333333333333, 0.9874, 0.2877, 0.438]}};
  const chartLabelsA = [["A-1: Education"], ["A-2: Humanities"], ["A-3: Arts"], ["A-4: Social Sciences,", "Journalism & Informatics"], ["A-5: Business,", "Administration & Law"], ["A-6: Natural Sciences,", "Math & Statistics"], ["A-7: ICT"], ["A-8: Engineering,", "Manufacturing & Construction"], ["A-9: Hardware Operation", "& Material Handling"], ["A-10: Agriculture, Forestry,", "Fisheries & Veterinary"], ["A-11: health & Welfare"], ["A-12: Services"]];
  const chartLabelsB = [["B-1: Teamwork &", "Communication"], ["B-2: Critical &", "Logical Thinking"], ["B-3: Language &", "Global Competence"], ["B-4: Ethics"], ["B-5: Self-Management", "& Autonomous Growth"], ["B-6: Problem Solving"], ["B-7: Adaptability"], ["B-8: Creativity"], ["B-9: Expressiveness", "& Presentation"], ["B-10: Info Processing", "& Digital Literacy"], ["B-11: Computer skills"], ["B-12: Leadership &", "Management"]];

  const btnContainer = document.getElementById('btn-container');
  const contentDiv = document.getElementById('content');
  const welcomeMsg = document.getElementById('welcome-msg');
  const sortControls = document.getElementById('sort-controls');
  const sortBtns = document.querySelectorAll('.sort-btn');

  let chartInstances = [];
  let currentUniv = null;
  let currentSortKey = 'score'; 


  const normFilter = document.getElementById('norm-filter');
  normFilter.addEventListener('change', (e) => {
    if (e.target.value === 'l2') {
      rankingData = rankingDataL2;
    } else {
      rankingData = rankingDataL1;
    }
    if (currentUniv) {
      renderRanking();
    }
  });

const allUnivs = Object.keys(rankingData);
  const buttons = [];

  allUnivs.forEach(univ => {
    const btn = document.createElement('button');
    btn.className = 'univ-btn';
    btn.textContent = univ;

    btn.onclick = (e) => {
      document.querySelectorAll('.univ-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentUniv = univ;
      welcomeMsg.style.display = 'none';
      sortControls.style.display = 'block'; 

      renderRanking(); 
    };
    btnContainer.appendChild(btn);
    buttons.push(btn);
  });

  sortBtns.forEach(btn => {
    btn.onclick = (e) => {
      sortBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentSortKey = e.target.getAttribute('data-sort'); 

      if (currentUniv) {
        renderRanking(); 
      }
    };
  });

  function renderRanking() {
    chartInstances.forEach(chart => chart.destroy());
    chartInstances = [];

    let data = [...rankingData[currentUniv]];

    data.sort((a, b) => {
      if (currentSortKey === 'euclid_dist') {
        return a[currentSortKey] - b[currentSortKey];
      } else {
        return b[currentSortKey] - a[currentSortKey];
      }
    });

    const getClass = (key) => currentSortKey === key ? 'score-col highlight-col' : 'score-col';

    let html = `<h1>「${currentUniv}」の類似度ランキング</h1>`;
    html += `
      <table>
        <thead>
          <tr>
            <th class="rank-col">順位</th>
            <th class="target-col">比較対象（大学）</th>
            <th class="${getClass('score')}">類似度ｽｺｱ</th>
            <th class="${getClass('dot_score')}">内積ｽｺｱ</th>
            <th class="${getClass('euclid_dist')}">ﾕｰｸﾘｯﾄﾞ距離</th>
            <th class="${getClass('tanimoto_score')}">谷本係数</th>
            <th class="chart-col">レーダーチャート (青: 基準, 赤: 比較対象)</th>
          </tr>
        </thead>
        <tbody>
    `;

    data.forEach((item, index) => {
      const rank = index + 1;
      html += `
        <tr>
          <td class="rank-col">${rank}</td>
          <td>${item.target}</td>
          <td class="${getClass('score')}">${item.score.toFixed(4)}</td>
          <td class="${getClass('dot_score')}">${item.dot_score.toFixed(4)}</td>
          <td class="${getClass('euclid_dist')}">${item.euclid_dist.toFixed(4)}</td>
          <td class="${getClass('tanimoto_score')}">${item.tanimoto_score.toFixed(4)}</td>
          <td class="chart-col">
            <button class="toggle-btn" onclick="toggleChart('chart-wrap-${index}', 'chartA-${index}', 'chartB-${index}')">グラフを表示 / 非表示</button>
            <div id="chart-wrap-${index}" class="hidden-chart">
              <div class="chart-container">
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 14px; margin-bottom: 5px;">(A) 知識関連</h3>
                  <canvas id="chartA-${index}"></canvas>
                </div>
                <div class="chart-wrapper">
                  <h3 style="text-align: center; font-size: 14px; margin-bottom: 5px;">(B) 汎用スキル</h3>
                  <canvas id="chartB-${index}"></canvas>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contentDiv.innerHTML = html;

    data.forEach((item, index) => {
      const compUnivKey = item.target;
      const targetValuesA = radarData[currentUniv] ? radarData[currentUniv].values_A : [];
      const compValuesA = radarData[compUnivKey] ? radarData[compUnivKey].values_A : [];

      const targetValuesB = radarData[currentUniv] ? radarData[currentUniv].values_B : [];
      const compValuesB = radarData[compUnivKey] ? radarData[compUnivKey].values_B : [];

      const ctxA = document.getElementById(`chartA-${index}`).getContext('2d');
      const radarChartA = new Chart(ctxA, {
          type: 'radar',
          data: {
              labels: chartLabelsA,
              datasets: [
                  {
                      label: currentUniv,
                      data: targetValuesA,
                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compUnivKey,
                      data: compValuesA,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: { font: { size: 10 }, color: '#666' }
                  }
              },
              plugins: {
                  legend: { display: false }
              }
          }
      });
      chartInstances.push(radarChartA);

      const ctxB = document.getElementById(`chartB-${index}`).getContext('2d');
      const radarChartB = new Chart(ctxB, {
          type: 'radar',
          data: {
              labels: chartLabelsB,
              datasets: [
                  {
                      label: currentUniv,
                      data: targetValuesB,
                      backgroundColor: 'rgba(54, 162, 235, 0.2)',
                      borderColor: 'rgba(54, 162, 235, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  },
                  {
                      label: compUnivKey,
                      data: compValuesB,
                      backgroundColor: 'rgba(255, 99, 132, 0.2)',
                      borderColor: 'rgba(255, 99, 132, 1)',
                      borderWidth: 1,
                      pointRadius: 2
                  }
              ]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  r: {
                      min: 0,
                      max: 3,
                      ticks: { stepSize: 1, display: false },
                      pointLabels: { font: { size: 10 }, color: '#666' }
                  }
              },
              plugins: {
                  legend: { display: false }
              }
          }
      });
      chartInstances.push(radarChartB);
    });
  }

  window.toggleChart = function(wrapId, chartAId, chartBId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('hidden-chart')) {
      wrap.classList.remove('hidden-chart');
      const chartInstanceA = Chart.getChart(chartAId);
      if (chartInstanceA) { chartInstanceA.resize(); }
      const chartInstanceB = Chart.getChart(chartBId);
      if (chartInstanceB) { chartInstanceB.resize(); }
    } else {
      wrap.classList.add('hidden-chart');
    }
  }
</script>
</body>
</html>
