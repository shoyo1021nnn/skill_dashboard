<style>

    padding: 0;
    color: #333;

  #sidebar {

    margin-top: 0;

    width: 100%;

    background-color: white;
    border: 1px solid #ccc;

  }
  #main {
    flex-grow: 1;
    padding: 30px;
    overflow-y: auto;
  }
  h1 {
    font-size: 24px;
    border-bottom: 2px solid #007bff;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .sort-controls {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #e9ecef;
    border-radius: 8px;
    display: none;
  }
  .sort-controls span {
    font-weight: bold;
    margin-right: 15px;
  }
  .sort-btn {
    padding: 8px 15px;
    margin-right: 10px;
    background-color: white;
    border: 1px solid #ced4da;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .sort-btn:hover { background-color: #e2e6ea; }
  .sort-btn.active { background-color: #28a745; color: white; border-color: #28a745; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 15px;
    text-align: left;
    vertical-align: middle;
  }
  th { background-color: #f8f9fa; }
  .rank-col { width: 60px; text-align: center; }
  .target-col { width: 300px; }
  .score-col { width: 90px; text-align: center; font-weight: bold; font-size: 14px;}

  .highlight-col { background-color: #fff3cd; }

  .chart-col { width: 700px; text-align: center; }
  .chart-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }
  .chart-wrapper {
    width: 320px;
    height: 320px;
  }
  #welcome-msg { color: #666; font-size: 18px; }
  .toggle-btn {
    padding: 6px 12px;
    background-color: #6c757d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .toggle-btn:hover { background-color: #5a6268; }
  .hidden-chart { display: none; }
</style>
</head>

</div>
