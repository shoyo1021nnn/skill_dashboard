<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学レベル評価 統合ダッシュボード（正規化版）</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .tabs {
            display: flex;
            background-color: #e9ecef;
            border-bottom: 2px solid #dee2e6;
        }
        .tab-button {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background-color: inherit;
            font-size: 16px;
            font-weight: bold;
            color: #495057;
            transition: 0.3s;
        }
        .tab-button:hover {
            background-color: #dee2e6;
        }
        .tab-button.active {
            background-color: white;
            color: #007bff;
            border-bottom: 3px solid #007bff;
        }
        .tab-content {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>大学レベル評価 統合ダッシュボード（正規化版）</h1>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab(event, 'SkillGraph')">1. レーダーチャート</button>
        <button class="tab-button" onclick="openTab(event, 'Ranking')">2. 類似度ランキング</button>
    </div>

    <div id="SkillGraph" class="tab-content active">
        <iframe src="university_radar_comparison_DBVer_with_norm.html?t=1789196057"></iframe>
    </div>

    <div id="Ranking" class="tab-content">
        <iframe src="similarity_ranking_with_chart_university_DBVer_with_norm.html?t=1789196057"></iframe>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
