<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>大学評価ダッシュボード</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .tab-container { display: flex; background-color: #f1f1f1; border-bottom: 1px solid #ccc; }
        .tab { padding: 14px 20px; cursor: pointer; border: none; background: inherit; font-size: 16px; transition: 0.3s; }
        .tab:hover { background-color: #ddd; }
        .tab.active { background-color: #fff; border-top: 3px solid #007bff; font-weight: bold; }
        .iframe-container { flex: 1; display: none; }
        .iframe-container.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab active" onclick="openTab(event, 'RadarChart')">レーダーチャート</button>
        <button class="tab" onclick="openTab(event, 'Similarity')">類似度ランキング</button>
    </div>

    <div id="RadarChart" class="iframe-container active">
        <iframe src="university_radar_comparison_DBVer.html"></iframe>
    </div>

    <div id="Similarity" class="iframe-container">
        <iframe src="similarity_ranking_with_chart_university_DBVer.html"></iframe>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, x, tablinks;
            x = document.getElementsByClassName("iframe-container");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
                x[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
